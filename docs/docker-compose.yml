version: "3.8"

# CAPRA prototype — local runtime.
# Reference stack used for the Beta iteration evidence (Figures 5.1–5.7 in the CA3 report).
#
# Bring up with:   docker compose -f docs/docker-compose.yml up -d
# Tear down with:  docker compose -f docs/docker-compose.yml down
#
# External services (NOT provisioned here):
#   - MongoDB Atlas   (durable stores — bind connection string to n8n credentials)
#   - Grafana Cloud   (Loki + Grafana dashboards)
#   - Azure OpenAI    (LLM endpoints)

name: context-processing-layer-prototype

services:

  n8n:
    image: n8nio/n8n:1.108.0
    container_name: context-processing-layer-prototype-n8n-1
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Australia/Sydney
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # Persist executions to on-disk sqlite (default). If moving to Postgres, set DB_TYPE=postgresdb.
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-files:/home/node/.n8n-files
    depends_on:
      fuseki:
        condition: service_healthy
      kafka:
        condition: service_healthy

  fuseki:
    image: stain/jena-fuseki:5.0.0
    container_name: context-processing-layer-prototype-fuseki-1
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin
      - FUSEKI_DATASET_1=ontology
      - JVM_ARGS=-Xmx1g
    volumes:
      - fuseki_data:/fuseki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3030/$$/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  # Kafka + Zookeeper power DFL's mock telemetry stream.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: context-processing-layer-prototype-zookeeper-1
    restart: unless-stopped
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 6

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: context-processing-layer-prototype-kafka-1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_LISTENERS=PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 8

  # Local Mongo helper — optional. Used only as a local write-through cache during dev.
  # The durable stores (telemetry_db, risk_intelligence_db, feedback_and_refinement_db)
  # live in MongoDB Atlas — set the connection string in n8n credentials, not here.
  mongo:
    image: mongo:7
    container_name: context-processing-layer-prototype-mongo-1
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  n8n_data:
  fuseki_data:
  mongo_data:
