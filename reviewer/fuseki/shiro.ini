[main]
# CAPRA reviewer route — local Fuseki access control.
#
# The workflow's Graph Importer nodes POST SPARQL updates to /ontology/update.
# Fuseki's stock configuration restricts update and Graph Store Protocol writes
# to the admin user, which would force the reviewer package to ship a password
# for the workflow to use. Instead, this local, loopback-only stack allows
# anonymous read and write on the demonstration dataset and keeps the server
# administration endpoints behind the admin account that bootstrap.sh uses to
# create the dataset.
#
# Do not reuse this file outside the local reviewer stack.

ssl.enabled = false

plainMatcher=org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
# Replaced on first start by the ADMIN_PASSWORD value in the compose file.
admin=capra-local-demo

[roles]

[urls]
## Open to anyone
/$/status = anon
/$/ping   = anon

## Server administration stays behind the admin account.
/$/** = authcBasic,user[admin]

## Dataset query, update, and Graph Store Protocol are open on this local stack.
/*/update/** = anon
/*/data/**   = anon
/*/sparql/** = anon

# Everything else
/**=anon
