apiVersion: 1

# The shipped CAPRA dashboards were exported against a Grafana Cloud stack and
# reference the Loki datasource by the UID 'grafanacloud-logs'. Provisioning the
# local Loki service under the same UID lets the dashboards load unchanged.
datasources:
  - name: CAPRA Loki
    type: loki
    uid: grafanacloud-logs
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
